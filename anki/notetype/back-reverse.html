<!-- amgi Listening (reversed) - Back Template.
     The answer to "what does this mean": the phrase in the language you
     already know, with the original underneath it.

     The two audio slots are swapped relative to the forward card, and that
     swap is the entire difference between the two directions. The loop plays
     the target-audio slot on reveal, so on this card that is the known
     language - which is the thing you were asked to produce. -->

<div class="amgi" data-amgi-card data-amgi-side="back" data-amgi-phase="answer">
  <div class="amgi-visual">
    <canvas class="amgi-visualizer" data-amgi-visualizer aria-hidden="true"></canvas>
  </div>

  <div class="amgi-text amgi-text-target">{{Cue}}</div>
  <div class="amgi-text amgi-text-cue" lang="{{Language}}">{{Target}}</div>
  {{#Notes}}<div class="amgi-text amgi-text-notes">{{Notes}}</div>{{/Notes}}

  <div class="amgi-slot" data-amgi-cue-audio>{{TargetAudio}}</div>
  <div class="amgi-slot" data-amgi-target-audio>{{CueAudio}}</div>

  <div class="amgi-actions">
    <button type="button" class="amgi-btn tappable" data-amgi-action="play" hidden>
      Tap to play
    </button>
    <button type="button" class="amgi-btn amgi-btn-quiet tappable" data-amgi-action="replay-cue">
      Hear it again
    </button>
    <button type="button" class="amgi-btn amgi-btn-quiet tappable" data-amgi-action="replay-native">
      Hear the answer
    </button>
    <button type="button" class="amgi-btn amgi-btn-quiet tappable" data-amgi-action="replay-you" hidden>
      Hear yourself
    </button>
  </div>

  <!-- No status line on this side, and nothing in its place - see back.html,
       which drops it for the same reason: it asked "How did you do?" directly
       above the Again / Hard / Good / Easy bar that answers it. -->

  <p class="amgi-note" data-amgi-note hidden></p>
</div>

<script src="_amgi-loop.js"></script>
