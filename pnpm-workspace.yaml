# plusaudio is its own self-contained package (own package.json, own
# node_modules, own engines constraint) that the web app reaches only from
# server-only route handlers (src/server/anki/) for the Node-only work of
# reading/writing a real Anki collection - see plusaudio/package.json's own
# description of why it stays out of the app's *bundled* dependency tree.
# Declaring it as a workspace member (and next.config.js's
# serverExternalPackages) is what lets Next require() it natively at
# runtime instead of trying to bundle it, which is a different thing from
# bundling it: nothing here changes what ships to the browser.
packages:
  - '.'
  - 'plusaudio'

# Dependencies allowed to run install scripts (pnpm asks before running any).
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
