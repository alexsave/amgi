# make test and make lint on every pull request and every push to main.
# The browser drives (npm run e2e) need headless Chrome and the Showcase fixture deck, so they still run locally.
name: test

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: macos-15
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            # The server links Homebrew's sqlite, ICU 78 and OpenSSL 3; the page builds with Homebrew's llvm (wasm32) and lld (wasm-ld).
            - name: Homebrew packages
              run: brew install sqlite icu4c@78 openssl@3 llvm lld

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            # The Anki library the Anki-backed tests run under, the version they pass with locally.
            - name: Anki library
              run: |
                  python -m venv "$RUNNER_TEMP/anki-venv"
                  "$RUNNER_TEMP/anki-venv/bin/pip" install --quiet anki==26.9.2
                  echo "ANKI_PYTHON_BIN=$RUNNER_TEMP/anki-venv/bin/python" >> "$GITHUB_ENV"

            - run: npm ci

            - name: make test
              run: make test

            - name: make lint
              run: make lint
